
workflows:
  ios-unsigned:
    name: CameraClone Unsigned IPA
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Check Xcode project
        script: |
          set -e
          echo "Checking project..."
          xcodebuild -list -project CameraClone.xcodeproj

      - name: Build iOS app
        script: |
          set -e

          mkdir -p "$CM_BUILD_DIR/build/products"

          xcodebuild \
            -project CameraClone.xcodeproj \
            -target CameraClone \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build/products" \
            build

      - name: Package unsigned IPA
        script: |
          set -e

          APP="$CM_BUILD_DIR/build/products/CameraClone.app"
          IPA="$CM_BUILD_DIR/build/CameraClone-unsigned.ipa"

          if [ ! -f "$APP/CameraClone" ]; then
            echo "ERROR: CameraClone executable not found."
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/build/ipa"
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"

          cp -R "$APP" \
            "$CM_BUILD_DIR/build/ipa/Payload/CameraClone.app"

          cd "$CM_BUILD_DIR/build/ipa"

          zip -qry "$IPA" Payload

          # IPA is intentionally unsigned; SideStore signs it on device.
          # A .p12 password error in AppleJR cannot be fixed by IPA packaging.

          unzip -t "$IPA"

          echo "IPA successfully created."

    artifacts:
      - build/CameraClone-unsigned.ipa
