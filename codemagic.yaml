workflows:
  ios-unsigned:
    name: Camera Clone unsigned IPA
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Build iOS app
        script: |
          set -e
          xcodebuild -project CameraClone.xcodeproj -scheme CameraClone -configuration Release -sdk iphoneos -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        script: |
          set -e
          APP="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/CameraClone.app"
          test -f "$APP/CameraClone"
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/ipa/Payload/CameraClone.app"
          cd "$CM_BUILD_DIR/build/ipa"
          zip -qry "$CM_BUILD_DIR/build/CameraClone-unsigned.ipa" Payload
          unzip -l "$CM_BUILD_DIR/build/CameraClone-unsigned.ipa" | grep 'Payload/CameraClone.app/CameraClone'
    artifacts:
      - build/CameraClone-unsigned.ipa
